name: Commit → In Progress
on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  set-in-progress:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[skip-pm]')"
    env:
      PROJECTS_PAT: ${{ secrets.PROJECTS_PAT }}
    steps:
      - name: Check PROJECTS_PAT
        if: env.PROJECTS_PAT == ''
        run: echo "PROJECTS_PAT not set — skipping"

      - name: Checkout
        if: env.PROJECTS_PAT != ''
        uses: actions/checkout@v7

      - name: Extract issue numbers from commit
        id: issues
        if: env.PROJECTS_PAT != ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if ! ISSUES=$(printf '%s' "$COMMIT_MSG" | grep -oE '#[0-9]+' | tr -d '#' | tr '\n' ',' | sed 's/,$//'); then
            ISSUES=""
          fi
          echo "issue_numbers=$ISSUES" >> "$GITHUB_OUTPUT"

      - name: Skip issues with pm:paused
        id: filtered
        if: env.PROJECTS_PAT != '' && steps.issues.outputs.issue_numbers != ''
        env:
          GH_TOKEN: ${{ env.PROJECTS_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.issues.outputs.issue_numbers }}
        run: |
          IFS=',' read -ra NUMS <<< "$ISSUE_NUMBERS"
          KEEP=()
          for N in "${NUMS[@]}"; do
            if ! LABELS=$(gh issue view "$N" --repo "$REPO" --json labels --jq '[.labels[].name]'); then
              echo "::warning::Could not look up #$N as an issue (issues and PRs share one numbering sequence — #$N may be a PR). See log above for the gh error. Skipping."
              continue
            fi
            if echo "$LABELS" | grep -q '"pm:paused"'; then
              echo "Issue #$N has pm:paused — skipping"
            else
              KEEP+=("$N")
            fi
          done
          IFS=','; echo "issue_numbers=${KEEP[*]}" >> "$GITHUB_OUTPUT"; unset IFS

      - name: Move to In Progress
        if: env.PROJECTS_PAT != '' && steps.filtered.outputs.issue_numbers != ''
        uses: ./.github/actions/pm-status-update
        with:
          github-token: ${{ env.PROJECTS_PAT }}
          issue-numbers: ${{ steps.filtered.outputs.issue_numbers }}
          target-status: In Progress
          guard-mode: allow-from
          guard-statuses: Triage,Backlog,Todo,Ready
